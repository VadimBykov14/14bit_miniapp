name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/bot-service/requirements.txt

      - name: Install dependencies
        run: pip install -r services/api/requirements.txt -r services/bot-service/requirements.txt

      - name: Подпись MAX
        working-directory: shared
        run: python -m unittest test_webapp_auth

      - name: API
        working-directory: services/api
        env:
          PYTHONPATH: ../../shared
        run: python -m unittest test_api

      - name: Бот
        working-directory: services/bot-service
        run: python -m unittest test_bot

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/miniapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/miniapp/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
